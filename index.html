<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Day</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17191c;--panel:#1d2024;--card:#1f2226;--line:#33373d;--text:#e8e9eb;--muted:#9aa0a6;
  --green:#5cc37a;--red:#e5534b;--accent:#3b8eea;--gold:#e0b84f;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px}
h1 span{color:var(--muted);font-weight:500;font-size:13px;margin-left:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent)}
.status{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.3}}
main{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}aside{order:-1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.card.new{animation:flash 2.5s ease-out}
@keyframes flash{from{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,142,234,.35)}}
.card.score{border-color:#5a4a1e}
.chead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;gap:10px}
.ptype{font-weight:700;font-size:16px;color:#c9ccd0;letter-spacing:.3px}
.card.score .ptype{color:var(--gold)}
.ctime{color:var(--muted);font-size:13px;text-align:right}
.prow{display:flex;align-items:center;padding:6px 16px;gap:12px;position:relative}
.prow::before{content:"";position:absolute;inset:0 40% 0 0;background:linear-gradient(90deg,var(--tc,transparent),transparent);opacity:.35;pointer-events:none}
.prow img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#2a2e33;flex:none;position:relative}
.pinfo{flex:1;min-width:0;position:relative}
.pname{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{color:var(--muted);font-size:12px}
.pts,.tot{text-align:right;width:70px;position:relative}
.pts b{display:block;font-size:15px;color:var(--green)}
.pts b.neg{color:var(--red)}
.tot{border-left:1px solid var(--line);padding-left:12px;width:82px}
.tot b{display:block;font-size:15px}
.pts small,.tot small{color:var(--muted);font-size:11px}
.desc{border-top:1px solid var(--line);padding:12px 16px;line-height:1.5;margin-top:8px}
.desc .dd{font-weight:600}
aside .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
aside h2{font-size:14px;margin:0 0 10px;font-weight:600}
.game{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:8px;cursor:pointer;gap:8px}
.game:hover,.game.sel{background:#2a2e33}
.game .tm{display:flex;flex-direction:column;gap:2px}
.game .tm div{display:flex;gap:8px;align-items:center}
.game img{width:20px;height:20px}
.game .sc{font-weight:600;min-width:22px;text-align:right}
.game .st{color:var(--muted);font-size:12px;text-align:right}
.game .st.live{color:var(--green)}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.more{display:block;margin:0 auto 20px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.tag.me{background:rgba(92,195,122,.18);color:var(--green)}
.tag.vs{background:rgba(229,83,75,.18);color:var(--red)}
.lg{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.lg select{width:100%;margin-top:6px}
.lg h3{margin:0 0 8px;font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.lg h3 small{color:var(--muted);font-weight:500;font-size:11px}
.lhead,.mrow{display:grid;grid-template-columns:minmax(0,1fr) 54px 48px 44px;gap:6px;align-items:center}
.lhead{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px}
.lhead span:nth-child(2){text-align:right}
.lhead span:nth-child(3){grid-column:3/5;text-align:center}
.lhead .ln{color:var(--text);font-size:14px}
.lhead .ln small{color:var(--muted);font-size:10px;font-weight:500;margin-left:4px}
.mrow{padding:3px 0;font-size:13px}
.mrow .nm{display:flex;min-width:0;gap:4px}
.mrow .nm .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mrow .nm .rc{flex:none;color:var(--muted)}
.mrow.mine .nm{font-weight:600}
.mrow .lp{text-align:right;font-weight:600}
.mrow .lp.lead{color:var(--green)}
.mrow .wp{text-align:right;font-size:12px;font-weight:600}
.mrow .wp.up{color:var(--text)}
.mrow .wp.down{color:var(--red)}
.mrow.danger{background:rgba(229,83,75,.12);border-radius:6px;margin:0 -6px;padding:3px 6px}
.bar{height:5px;background:#33373d;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar i.up{background:var(--green)}
.bar i.down{background:var(--red)}
.mu.small{border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.mu.small .mrow{font-size:12px}
.all{display:block;text-align:center;color:var(--accent);font-size:12px;margin-top:8px;cursor:pointer;text-decoration:underline}
.col3{display:none}
main.three{grid-template-columns:minmax(0,1fr) 380px 480px;max-width:1900px}
main.three .col3{display:block}
.mu[data-mu]{cursor:pointer;border-radius:6px}
.mu[data-mu]:hover,.mu.sel{background:#2a2e33}
.md{padding:12px}
.mdtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:600}
.mdtop button{padding:4px 10px;font-size:12px}
.mdhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-bottom:12px}
.mdhead .R{text-align:right}
.mdhead .tn2{font-weight:600;font-size:14px}
.mdhead .muted{font-size:11px}
.mdhead .vs{align-self:center;font-size:12px}
.cmps{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.cmp{display:grid;grid-template-columns:1fr 56px 72px 56px 1fr;gap:6px;align-items:center;padding:4px 0;font-size:12px}
.cb{height:6px;background:#2a2e33;border-radius:3px;overflow:hidden;display:flex}
.cb.L{justify-content:flex-end}
.cb i{display:block;height:100%;background:#5b6068;border-radius:3px}
.cb i.up{background:var(--green)}
.cb i.down{background:var(--red)}
.cv.L{text-align:right}
.cv.L.up{color:var(--green)}
.cv.L.down{color:var(--red)}
.cl{text-align:center;color:var(--text);font-weight:500}
.slotcard{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:4px 8px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 48px 38px 48px minmax(0,1fr);gap:6px;align-items:center;padding:8px 0}
.pr + .pr{border-top:1px solid #2a2e33}
.pl{display:flex;gap:8px;align-items:center;min-width:0}
.pl.R{flex-direction:row-reverse;text-align:right}
.pl img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#2a2e33;flex:none}
.pt{min-width:0}
.pn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:11px;color:var(--muted);line-height:1.4}
.ps b{color:var(--text);font-weight:600}
.livec{color:var(--green)}
.pp{display:flex;flex-direction:column;font-size:14px}
.pp.L{text-align:right;align-items:flex-end}
.pp.R{text-align:left;align-items:flex-start}
.pp b{font-weight:600}
.pp small{color:var(--muted);font-size:11px}
.sb{justify-self:center;font-size:11px;font-weight:700;padding:5px 0;width:38px;text-align:center;border-radius:6px;color:#fff}
.sb.qb{background:#6b5b95}.sb.rb{background:#2f6db5}.sb.wr{background:#2e7d4f}.sb.te{background:#c0702f}
.sb.fx{background:#5b6068}.sb.k{background:#4a5565}.sb.bn{background:#33373d;color:var(--muted)}
.benchhead{text-align:center;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--muted);margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.benchhead::before,.benchhead::after{content:"";flex:1;border-top:2px dashed var(--line)}
.err{background:#3a1f1f;border:1px solid #6b2d2d;color:#f2b8b5;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Game Day <span id="wk"></span></h1>
    <div class="status" id="status">Loading…</div>
  </div>
  <div class="filters">
    <select id="fGame"><option value="all">All Games</option></select>
    <select id="fPos">
      <option value="all">All Positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option>
    </select>
    <select id="fScoring">
      <option value="1">PPR</option><option value="0.5">Half PPR</option><option value="0">Standard</option>
    </select>
    <select id="fPassTd">
      <option value="4">4 pt Pass TD</option><option value="6">6 pt Pass TD</option>
    </select>
    <button id="fFantasy" class="on">Fantasy plays only</button>
    <button id="fMine">My matchups only</button>
  </div>
</header>

<main>
  <section>
    <div class="err" id="err"></div>
    <div id="feed"></div>
    <button class="more" id="more" style="display:none">Load more plays</button>
  </section>
  <aside id="side">
    <div class="box md" id="detail" style="display:none"></div>
    <div class="box" id="lbox">
      <h2>My Leagues</h2>
      <div id="leagues" class="muted">Loading leagues…</div>
    </div>
    <div class="box" id="gbox">
      <h2>Games</h2>
      <div id="games" class="muted">Loading…</div>
    </div>
  </aside>
  <aside id="col3" class="col3"></aside>
</main>

<script>
const CONFIG = {
  sleeperUser: 'PMak2323',
  espnLeagues: [
    {id: '1862087001', type: 'h2h'},
    {id: '1652301115', type: 'knockout'}
  ],
  season: 2026
};
const SB = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
const SUMMARY = id => `https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=${id}`;
const PLAYS = (id, page) => `https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/events/${id}/competitions/${id}/plays?limit=400&page=${page}`;
const ATHLETE = id => `https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/athletes/${id}`;
const HEADSHOT = id => `https://a.espncdn.com/combiner/i?img=/i/headshots/nfl/players/full/${id}.png&w=96&h=96&scale=crop`;
const POS = {1:'WR',7:'TE',8:'QB',9:'RB',10:'FB',22:'K'};
const POLL_MS = 20000;
const PAGE = 120;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const state = {
  games: {},          // id -> {id, away, home, state, detail, date}
  plays: {},          // gameId -> raw play items
  athletes: store.get('gd.ath', {}), // id -> {name, team}
  summaryAt: {},
  seen: new Set(),
  firstRender: true,
  shown: PAGE,
  leagues: [],        // {key, name, platform, me, opp, myIds:Set, oppIds:Set, error, teams}
  leaguesAt: 0,
  stats: {},          // espn athlete id -> {passing:{...}, rushing:{...}, receiving:{...}, kicking:{...}}
  openMu: null,       // {key, idx} of the matchup shown in the detail view
  expanded: new Set(),
  settings: Object.assign({rec:1, passTd:4, game:'all', pos:'all', fantasy:true, mine:false}, store.get('gd.settings', {}))
};

const $ = id => document.getElementById(id);

async function getJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error(r.status + ' ' + url);
  return r.json();
}
const idFrom = (ref, key) => { const m = (ref||'').match(new RegExp(key + '/(\\d+)')); return m ? m[1] : null; };

/* ---------- data loading ---------- */
async function loadScoreboard(){
  const d = await getJSON(SB);
  $('wk').textContent = d.week ? `Week ${d.week.number}` : '';
  for(const ev of d.events || []){
    const c = ev.competitions[0];
    const side = ha => {
      const t = c.competitors.find(x => x.homeAway === ha);
      return {id:t.team.id, abbr:t.team.abbreviation, score:t.score, color:t.team.color, logo:t.team.logo};
    };
    state.games[ev.id] = {
      id: ev.id, date: ev.date, away: side('away'), home: side('home'),
      state: ev.status.type.state, detail: ev.status.type.shortDetail,
      period: ev.status.period, clock: ev.status.clock,
      done: !!state.games[ev.id]?.done
    };
  }
}

async function loadSummary(id){
  const d = await getJSON(SUMMARY(id));
  for(const tp of d.boxscore?.players || []){
    for(const cat of tp.statistics || []){
      for(const a of cat.athletes || []){
        state.athletes[a.athlete.id] = {name:a.athlete.displayName, team:tp.team.abbreviation};
        const row = {};
        (cat.labels || []).forEach((lb, i) => row[lb] = a.stats?.[i]);
        (state.stats[a.athlete.id] = state.stats[a.athlete.id] || {})[cat.name] = row;
      }
    }
  }
  state.summaryAt[id] = Date.now();
}

async function loadPlays(id){
  let page = 1, items = [];
  while(true){
    const d = await getJSON(PLAYS(id, page));
    items = items.concat(d.items || []);
    if(page >= (d.pageCount || 1)) break;
    page++;
  }
  state.plays[id] = items;
}

async function fillMissingAthletes(ids){
  const missing = [...ids].filter(id => !state.athletes[id]).slice(0, 25);
  await Promise.all(missing.map(async id => {
    try{
      const a = await getJSON(ATHLETE(id));
      state.athletes[id] = {name:a.displayName, team:null};
    }catch(e){}
  }));
  store.set('gd.ath', state.athletes);
}

/* ---------- league sync ---------- */
const normName = n => String(n || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, '').replace(/[^a-z]/g, '');
const teamKey = a => a === 'WAS' ? 'WSH' : a;   // Sleeper uses WAS, ESPN uses WSH
const shortName = n => { const p = String(n || '').split(' '); return p.length > 1 ? `${p[0][0]}. ${p.slice(1).join(' ')}` : n; };

// Sleeper id -> [espnId or '', normalized name, display name, position, team]
async function sleeperIdMap(){
  const cached = store.get('gd.slmap3', null);
  if(cached && Date.now() - cached.at < 3 * 864e5) return cached.map;
  const all = await getJSON('https://api.sleeper.app/v1/players/nfl');
  const map = {};
  for(const [sid, p] of Object.entries(all)){
    if(!['QB','RB','WR','TE','K','FB','DEF'].includes(p.position)) continue;
    const name = p.position === 'DEF' ? `${p.last_name} D/ST` : (p.full_name || `${p.first_name} ${p.last_name}`);
    map[sid] = [p.espn_id ? String(p.espn_id) : '', p.position === 'DEF' ? '' : normName(name), name, p.position, teamKey(p.team || (p.position === 'DEF' ? sid : ''))];
  }
  store.set('gd.slmap3', {at: Date.now(), map});
  return map;
}

// Sleeper weekly projections (full PPR), indexed three ways
let projCache = {at: 0, week: 0, data: null};
async function loadProjections(week){
  if(projCache.data && projCache.week === week && Date.now() - projCache.at < 10 * 60000) return projCache.data;
  const pos = ['QB','RB','WR','TE','K','DEF'].map(p => 'position[]=' + p).join('&');
  const rows = await getJSON(`https://api.sleeper.app/projections/nfl/${CONFIG.season}/${week}?season_type=regular&${pos}`);
  const data = {bySleeper:{}, byName:{}, byDef:{}};
  for(const r of rows){
    const p = {pts: r.stats?.pts_ppr || 0, team: teamKey(r.team)};
    data.bySleeper[r.player_id] = p;
    if(r.player?.position === 'DEF') data.byDef[teamKey(r.team)] = p;
    else data.byName[normName(`${r.player?.first_name} ${r.player?.last_name}`)] = p;
  }
  projCache = {at: Date.now(), week, data};
  return data;
}

const gameForTeam = abbr => Object.values(state.games).find(x => x.away.abbr === abbr || x.home.abbr === abbr);

// Share of a team's game still to be played (1 = not started, 0 = final or bye)
function fracLeft(abbr){
  const g = gameForTeam(abbr);
  if(!g) return 0;
  if(g.state === 'pre') return 1;
  if(g.state === 'post') return 0;
  if(g.period > 4) return 0.03;
  return Math.min(1, Math.max(0.02, ((4 - g.period) * 900 + (g.clock || 0)) / 3600));
}

// Remaining projected points and variance from a list of starter projections
function remaining(projs){
  let rem = 0, v = 0, mins = 0;
  for(const p of projs){
    if(!p) continue;
    const f = fracLeft(p.team);
    rem += p.pts * f;
    v += Math.pow(0.5 * p.pts, 2) * f;
    mins += 60 * f;
  }
  return {rem, v, mins};
}

function erf(x){
  const s = Math.sign(x); x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}
function setWinPct(a, b){
  const margin = (a.pts + a.rem) - (b.pts + b.rem);
  const sd = Math.sqrt(a.v + b.v);
  const p = sd < 0.1 ? (margin > 0 ? 1 : margin < 0 ? 0 : 0.5) : 0.5 * (1 + erf(margin / sd / Math.SQRT2));
  a.win = p; b.win = 1 - p;
}
const ordinal = n => n + (['th','st','nd','rd'][((n % 100) - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

async function loadSleeper(proj, week){
  const out = [];
  const user = await getJSON(`https://api.sleeper.app/v1/user/${CONFIG.sleeperUser}`);
  const leagues = await getJSON(`https://api.sleeper.app/v1/user/${user.user_id}/leagues/nfl/${CONFIG.season}`);
  const map = await sleeperIdMap();
  const ids = list => {
    const set = new Set();
    for(const id of list || []){
      const m = map[id]; if(!m) continue;
      if(m[0]) set.add(m[0]);
      if(m[1]) set.add('n:' + m[1]);
    }
    return set;
  };
  for(const lg of leagues){
    try{
      const [rosters, users, matchups] = await Promise.all([
        getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/rosters`),
        getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/users`),
        getJSON(`https://api.sleeper.app/v1/league/${lg.league_id}/matchups/${week}`)
      ]);
      const places = {};
      [...rosters].sort((a, b) => (b.settings?.wins || 0) - (a.settings?.wins || 0) || ((b.settings?.fpts || 0) + (b.settings?.fpts_decimal || 0) / 100) - ((a.settings?.fpts || 0) + (a.settings?.fpts_decimal || 0) / 100))
        .forEach((r, i) => places[r.roster_id] = i + 1);
      const slots = (lg.roster_positions || []).filter(s => s !== 'BN' && s !== 'IR' && s !== 'TAXI');
      const player = (id, slot, m) => {
        const info = map[id] || ['', '', id, '', ''];
        const p = proj.bySleeper[id];
        const isDef = info[3] === 'DEF';
        return {
          slot, name: info[2], short: isDef ? info[2] : shortName(info[2]), pos: info[3], team: p?.team || info[4],
          espnId: info[0], norm: info[1],
          img: isDef ? `https://sleepercdn.com/images/team_logos/nfl/${String(id).toLowerCase()}.png` : `https://sleepercdn.com/content/nfl/players/thumb/${id}.jpg`,
          pts: m.players_points?.[id] ?? 0, proj: p?.pts ?? 0
        };
      };
      const side = m => {
        const r = rosters.find(x => x.roster_id === m.roster_id) || {};
        const u = users.find(x => x.user_id === r.owner_id) || {};
        const startIds = (m.starters || []);
        const lineup = startIds.map((id, i) => id && id !== '0' ? player(id, slots[i] || 'FLEX', m) : {slot: slots[i] || 'FLEX', empty: true});
        const bench = (m.players || []).filter(id => !startIds.includes(id)).map(id => player(id, 'BN', m));
        const starters = startIds.filter(id => id && id !== '0').map(id => proj.bySleeper[id]);
        return {
          name: u.metadata?.team_name || u.display_name || 'Team',
          record: `${r.settings?.wins || 0}-${r.settings?.losses || 0}`, place: places[r.roster_id],
          pts: m.points || 0, ...remaining(starters), lineup, bench,
          mine: r.owner_id === user.user_id, ids: ids(m.players || r.players)
        };
      };
      const groups = {};
      for(const m of matchups){ if(m.matchup_id != null) (groups[m.matchup_id] = groups[m.matchup_id] || []).push(m); }
      const games = Object.values(groups).filter(g => g.length === 2).map(([x, y]) => {
        let a = side(x), b = side(y);
        if(b.mine){ [a, b] = [b, a]; }
        setWinPct(a, b);
        return {a, b, mine: a.mine};
      });
      const my = games.find(g => g.mine);
      out.push({
        key: 'sl' + lg.league_id, platform: 'Sleeper', name: lg.name, games,
        me: my?.a, opp: my?.b, myIds: my?.a.ids || new Set(), oppIds: my?.b.ids || new Set()
      });
    }catch(e){ out.push({key:'sl' + lg.league_id, platform:'Sleeper', name:lg.name, error:e.message, myIds:new Set(), oppIds:new Set()}); }
  }
  return out;
}

const espnTeamKey = id => 'gd.espnTeam.' + id;
function espnMyTeam(id){
  let v = store.get(espnTeamKey(id), null);
  // carry over the pick saved before multi-league support
  if(!v && id === CONFIG.espnLeagues[0].id){ v = store.get('gd.espnTeam', null); if(v) store.set(espnTeamKey(id), v); }
  return v;
}

// Sum a player's actual fantasy points for the current scoring period from ESPN roster data
function espnActual(pl, sp){
  const s = (pl?.stats || []).find(x => x.scoringPeriodId === sp && x.statSourceId === 0 && x.statSplitTypeId === 1);
  return s?.appliedTotal || 0;
}

// Monte Carlo: chance each team avoids finishing last
function setSurvivePct(teams){
  const N = 4000, low = new Array(teams.length).fill(0);
  const gauss = () => { let u = 0, v = 0; while(!u) u = Math.random(); while(!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  for(let i = 0; i < N; i++){
    let min = Infinity, at = -1;
    teams.forEach((t, j) => {
      const f = t.pts + t.rem + Math.sqrt(t.v) * gauss();
      if(f < min){ min = f; at = j; }
    });
    low[at]++;
  }
  teams.forEach((t, j) => { t.win = 1 - low[j] / N; });
}

async function loadEspn(proj, cfg){
  const key = 'es' + cfg.id;
  const knockout = cfg.type === 'knockout';
  try{
    const views = ['mTeam','mRoster','mMatchupScore','mScoreboard','mSettings'].map(v => 'view=' + v).join('&');
    const d = await getJSON(`https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${CONFIG.season}/segments/0/leagues/${cfg.id}?${views}`);
    const teamName = t => t.name || `${t.location || ''} ${t.nickname || ''}`.trim() || t.abbrev;
    const teams = (d.teams || []).map(t => ({id:String(t.id), name:teamName(t)}));
    const lg = {key, platform:'ESPN', knockout, name: d.settings?.name || 'ESPN League', teams, games:[], myIds:new Set(), oppIds:new Set(), espnId: cfg.id};
    const myId = espnMyTeam(cfg.id);
    if(!myId) return lg;

    const abbrById = {};
    Object.values(state.games).forEach(g => { abbrById[g.away.id] = g.away.abbr; abbrById[g.home.id] = g.home.abbr; });
    const projFor = pl => {
      if(!pl) return null;
      if(pl.defaultPositionId === 16) return proj.byDef[abbrById[String(pl.proTeamId)]] || null;
      return proj.byName[normName(pl.fullName)] || null;
    };
    const sp = d.scoringPeriodId;
    const period = d.status?.currentMatchupPeriod || sp;
    const sched = (d.schedule || []).filter(m => m.matchupPeriodId === period);
    const schedSide = id => {
      for(const m of sched){
        if(String(m.home?.teamId) === id) return m.home;
        if(String(m.away?.teamId) === id) return m.away;
      }
      return null;
    };
    const SLOT = {0:'QB',2:'RB',3:'RB/WR',4:'WR',5:'WR/TE',6:'TE',7:'OP',16:'DEF',17:'K',23:'FLEX'};
    const ORDER = [0,2,3,4,5,6,23,7,16,17];
    const places = {};
    [...(d.teams || [])].sort((a, b) => (b.record?.overall?.wins || 0) - (a.record?.overall?.wins || 0) || (b.record?.overall?.pointsFor || 0) - (a.record?.overall?.pointsFor || 0))
      .forEach((t, i) => places[t.id] = i + 1);
    const player = (e, slot) => {
      const pl = e.playerPoolEntry?.player || {};
      const isDef = pl.defaultPositionId === 16;
      const abbr = abbrById[String(pl.proTeamId)] || '';
      const pj = projFor(pl);
      return {
        slot, name: pl.fullName || 'Player', short: isDef ? pl.fullName : shortName(pl.fullName),
        pos: isDef ? 'DEF' : (SLOT[[0,0,2,4,6][pl.defaultPositionId]] || ({5:'K'})[pl.defaultPositionId] || ''),
        team: pj?.team || abbr, espnId: String(e.playerId), norm: normName(pl.fullName),
        img: isDef ? `https://a.espncdn.com/i/teamlogos/nfl/500/${abbr.toLowerCase()}.png` : HEADSHOT(e.playerId),
        pts: espnActual(pl, sp), proj: pj?.pts ?? 0
      };
    };
    const build = (t, s) => {
      const rec = t.record?.overall;
      const entries = t.roster?.entries || [];
      const start = entries.filter(e => e.lineupSlotId !== 20 && e.lineupSlotId !== 21);
      const actual = start.reduce((sum, e) => sum + espnActual(e.playerPoolEntry?.player, sp), 0);
      const rank = id => { const i = ORDER.indexOf(id); return i < 0 ? 99 : i; };
      const lineup = [...start].sort((a, b) => rank(a.lineupSlotId) - rank(b.lineupSlotId)).map(e => player(e, SLOT[e.lineupSlotId] || 'FLEX'));
      const bench = entries.filter(e => e.lineupSlotId === 20).map(e => player(e, 'BN'));
      return {
        lineup, bench, place: places[t.id],
        id: String(t.id), name: teamName(t), record: rec ? `${rec.wins}-${rec.losses}` : '',
        pts: s?.totalPointsLive ?? s?.totalPoints ?? actual, ...remaining(start.map(e => projFor(e.playerPoolEntry?.player))),
        mine: String(t.id) === myId, ids: new Set(entries.map(e => String(e.playerId))), starters: start.length
      };
    };

    if(knockout){
      // Alive = teams on this week's schedule; if ESPN doesn't list any, fall back to teams with a set lineup
      let alive = (d.teams || []).filter(t => schedSide(String(t.id)));
      if(!alive.length) alive = (d.teams || []).filter(t => (t.roster?.entries || []).some(e => e.lineupSlotId !== 20 && e.lineupSlotId !== 21));
      const list = alive.map(t => build(t, schedSide(String(t.id))));
      setSurvivePct(list);
      list.sort((a, b) => b.win - a.win || (b.pts + b.rem) - (a.pts + a.rem));
      const me = list.find(t => t.mine);
      return Object.assign(lg, {ko: list, me, myIds: me?.ids || new Set()});
    }

    const side = s => {
      const t = (d.teams || []).find(x => String(x.id) === String(s?.teamId));
      return t ? build(t, s) : null;
    };
    lg.games = sched.filter(m => m.home && m.away).map(m => {
      let a = side(m.home), b = side(m.away);
      if(!a || !b) return null;
      if(b.mine){ [a, b] = [b, a]; }
      setWinPct(a, b);
      return {a, b, mine: a.mine};
    }).filter(Boolean);
    const my = lg.games.find(g => g.mine);
    return Object.assign(lg, {me: my?.a, opp: my?.b, myIds: my?.a.ids || new Set(), oppIds: my?.b.ids || new Set()});
  }catch(e){
    return {key, platform:'ESPN', knockout, name: knockout ? 'ESPN Knockout' : 'ESPN League', error:e.message, myIds:new Set(), oppIds:new Set()};
  }
}

async function loadLeagues(){
  const nfl = await getJSON('https://api.sleeper.app/v1/state/nfl');
  const week = nfl.display_week || nfl.week;
  const proj = await loadProjections(week).catch(() => ({bySleeper:{}, byName:{}, byDef:{}}));
  const [sl, ...es] = await Promise.all([
    loadSleeper(proj, week).catch(e => [{key:'sl', platform:'Sleeper', name:'Sleeper', error:e.message, myIds:new Set(), oppIds:new Set()}]),
    ...CONFIG.espnLeagues.map(cfg => loadEspn(proj, cfg))
  ]);
  state.leagues = [...sl, ...es];
  state.leaguesAt = Date.now();
}

function statLine(p, nameIdx){
  const id = (p.espnId && state.stats[p.espnId]) ? p.espnId : nameIdx[p.norm];
  const st = id && state.stats[id];
  if(!st) return '';
  const out = [];
  const add = (v, label) => { if(v != null && v !== '' && v !== '0' && v !== '0/0') out.push(`<b>${esc(v)}</b> ${label}`); };
  if(st.passing){ add(st.passing['C/ATT'], 'C/Att'); add(st.passing.YDS, 'PaYd'); add(st.passing.TD, 'PaTD'); add(st.passing.INT, 'Int'); }
  if(st.rushing){ add(st.rushing.YDS, 'RuYd'); add(st.rushing.TD, 'RuTD'); }
  if(st.receiving){ add(st.receiving.TGTS, 'Tgt'); add(st.receiving.REC, 'Rec'); add(st.receiving.YDS, 'RecYd'); add(st.receiving.TD, 'RecTD'); }
  if(st.kicking){ add(st.kicking.FG, 'FG'); add(st.kicking.XP, 'XP'); }
  return out.join(' ');
}

function gameNote(p){

function playerBlock(p, side, nameIdx){

const slotClass = s => ({QB:'qb', RB:'rb', WR:'wr', TE:'te', K:'k', DEF:'k', BN:'bn'})[s] || 'fx';

function pairsHtml(left, right, nameIdx){
  let html = '', prev = null;
  const n = Math.max(left.length, right.length);
  for(let i = 0; i < n; i++){
    const a = left[i], b = right[i];
    const slot = (a || b).slot;
    if(slot !== prev){ if(prev !== null) html += '</div>'; html += '<div class="slotcard">'; prev = slot; }
    html += `<div class="pr">${playerBlock(a, 'L', nameIdx)}<div class="sb ${slotClass(slot)}">${esc(slot)}</div>${playerBlockRight(b, nameIdx)}</div>`;
  }
  return html + (prev !== null ? '</div>' : '');
}

/* ---------- fantasy scoring ---------- */
function scorePlay(p, s){
  const t = p.type?.text || '';
  const txt = p.text || '';
  if(t === 'Penalty' || (p.isPenalty && /no play/i.test(txt))) return [];
  const seen = new Set(), parts = [];
  for(const x of p.participants || []){
    const id = idFrom(x.athlete?.$ref, 'athletes');
    const key = id + x.type;
    if(!id || seen.has(key)) continue;
    seen.add(key);
    parts.push({id, type:x.type, pos:POS[idFrom(x.position?.$ref, 'positions')]});
  }
  const rows = {};
  const add = (x, pts) => {
    if(!x || !x.pos || !pts) return;
    rows[x.id] = rows[x.id] || {id:x.id, pos:x.pos, delta:0};
    rows[x.id].delta += pts;
  };
  const one = type => parts.find(x => x.type === type);
  const yd = p.statYardage || 0;
  const isTD = /Touchdown/.test(t);

  if(t === 'Rush' || t === 'Rushing Touchdown'){
    add(one('rusher'), yd * 0.1 + (isTD ? 6 : 0));
  }
  if(t === 'Pass Reception' || t === 'Passing Touchdown'){
    add(one('passer'), yd * 0.04 + (isTD ? s.passTd : 0));
    add(one('receiver'), s.rec + yd * 0.1 + (isTD ? 6 : 0));
  }
  if(/Interception/.test(t)) add(one('passer'), -2);
  if(/Field Goal Good/.test(t)){
    const m = txt.match(/(\d+)\s*yard field goal/i);
    const dist = m ? +m[1] : yd;
    add(one('kicker') || one('fieldGoalKicker'), dist >= 50 ? 5 : dist >= 40 ? 4 : 3);
  }
  if(p.pointAfterAttempt?.value === 1 && /extra point is good/i.test(txt)) add(one('patScorer'), 1);
  if(/(Kickoff|Punt) Return Touchdown/.test(t)) add(one('returner'), 6);
  if(p.isTurnover && !/Interception/.test(t)){
    const f = parts.find(x => /fumbl/i.test(x.type));
    if(f) add(f, -2);
  }
  return Object.values(rows).map(r => ({...r, delta: Math.round(r.delta * 100) / 100}));
}

function label(p){
  const t = p.type?.text || '';
  if(t === 'Rush') return 'RUN PLAY';
  if(t === 'Pass Reception' || t === 'Pass Incompletion') return 'PASS PLAY';
  if(t === 'Passing Touchdown') return 'PASSING TD';
  if(t === 'Rushing Touchdown') return 'RUSHING TD';
  if(/Interception/.test(t)) return 'INTERCEPTION';
  if(/Field Goal Good/.test(t)) return 'FIELD GOAL';
  if(/Return Touchdown/.test(t)) return 'RETURN TD';
  return t.toUpperCase();
}

function buildFeed(){
  const s = state.settings, out = [];
  for(const [gid, items] of Object.entries(state.plays)){
    const g = state.games[gid];
    if(!g) continue;
    const sorted = [...items].sort((a, b) => +a.sequenceNumber - +b.sequenceNumber);
    const totals = {};
    for(const p of sorted){
      const rows = scorePlay(p, s);
      rows.forEach(r => { totals[r.id] = Math.round(((totals[r.id] || 0) + r.delta) * 100) / 100; r.total = totals[r.id]; });
      out.push({p, g, rows, when: Date.parse(p.wallclock || p.modified || 0) || 0, seq: +p.sequenceNumber});
    }
  }
  return out.sort((a, b) => b.when - a.when || b.seq - a.seq);
}

/* ---------- rendering ---------- */
function clock(p){
  const n = p.period?.number;
  const q = n > 4 ? 'OT' : 'Q' + n;
  return `${q} ${p.clock?.displayValue || ''}`;
}
const fmt = n => (n > 0 ? '+' : '') + n.toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const s = state.settings;
  let feed = buildFeed();
  if(s.game !== 'all') feed = feed.filter(x => x.g.id === s.game);
  if(s.pos !== 'all') feed = feed.map(x => ({...x, rows: x.rows.filter(r => r.pos === s.pos)}));
  if(s.mine) feed = feed.map(x => ({...x, rows: x.rows.filter(r => inMyMatchups(r.id))}));
  if(s.fantasy || s.pos !== 'all' || s.mine) feed = feed.filter(x => x.rows.length);

  const html = feed.slice(0, state.shown).map(({p, g, rows}) => {
    const isNew = !state.firstRender && !state.seen.has(p.id);
    state.seen.add(p.id);
    const tm = abbr => abbr === g.away.abbr ? g.away : g.home;
    const people = rows.map(r => {
      const a = state.athletes[r.id] || {};
      const team = a.team || '';
      const color = team ? '#' + (tm(team).color || '444') : 'transparent';
      return `<div class="prow" style="--tc:${color}">
        <img src="${HEADSHOT(r.id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="pinfo"><div class="pname">${esc(a.name || 'Player ' + r.id)}</div>
        <div class="pmeta">${r.pos}${team ? ' - ' + team : ''}${tagsFor(r.id)}</div></div>
        <div class="pts"><b class="${r.delta < 0 ? 'neg' : ''}">${fmt(r.delta)}</b><small>PTS</small></div>
        <div class="tot"><b>${r.total.toFixed(2)}</b><small>TOTAL</small></div>
      </div>`;
    }).join('');
    const dd = p.start?.down > 0 ? `<span class="dd">${esc(p.start.shortDownDistanceText)}, ${esc(p.start.possessionText)}</span> ` : '';
    return `<div class="card${p.scoringPlay ? ' score' : ''}${isNew ? ' new' : ''}">
      <div class="chead"><div class="ptype">${esc(label(p))}</div>
      <div class="ctime">${clock(p)} (${g.away.abbr} ${p.awayScore} - ${p.homeScore} ${g.home.abbr})</div></div>
      ${people}
      <div class="desc">${dd}${esc(p.text)}</div>
    </div>`;
  }).join('');

  $('feed').innerHTML = html || `<div class="empty">No plays yet. The feed fills in once games kick off.</div>`;
  $('more').style.display = feed.length > state.shown ? 'block' : 'none';
  state.firstRender = false;
  renderGames();
  if(state.leaguesAt) renderLeagues();
  if(state.openMu) renderDetail();
}

function renderGames(){
  const list = Object.values(state.games).sort((a, b) => {
    const rank = g => g.state === 'in' ? 0 : g.state === 'pre' ? 1 : 2;
    return rank(a) - rank(b) || Date.parse(a.date) - Date.parse(b.date);
  });
  $('games').innerHTML = list.map(g => `
    <div class="game${state.settings.game === g.id ? ' sel' : ''}" data-id="${g.id}">
      <div class="tm">
        <div><img src="${g.away.logo}" alt=""> ${g.away.abbr}</div>
        <div><img src="${g.home.logo}" alt=""> ${g.home.abbr}</div>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="tm">${g.state === 'pre' ? '' : `<div class="sc">${g.away.score}</div><div class="sc">${g.home.score}</div>`}</div>
        <div class="st${g.state === 'in' ? ' live' : ''}">${esc(g.detail)}</div>
      </div>
    </div>`).join('') || 'No games this week.';

  const sel = $('fGame'), cur = state.settings.game;
  sel.innerHTML = '<option value="all">All Games</option>' + list
    .filter(g => g.state !== 'pre')
    .map(g => `<option value="${g.id}">${g.away.abbr} @ ${g.home.abbr}</option>`).join('');
  sel.value = list.some(g => g.id === cur) ? cur : 'all';
}

/* ---------- loop ---------- */
async function refresh(){
  try{
    await loadScoreboard();
    if(Date.now() - state.leaguesAt > 60000) await loadLeagues();
    const active = Object.values(state.games).filter(g => g.state === 'in' || (g.state === 'post' && !g.done));
    await Promise.all(active.map(async g => {
      try{
        if(!state.summaryAt[g.id] || Date.now() - state.summaryAt[g.id] > 120000) await loadSummary(g.id);
        await loadPlays(g.id);
        if(g.state === 'post') g.done = true;
      }catch(e){ console.warn(e); }
    }));
    const ids = new Set();
    Object.values(state.plays).forEach(items => items.forEach(p => scorePlay(p, state.settings).forEach(r => ids.add(r.id))));
    await fillMissingAthletes(ids);
    store.set('gd.ath', state.athletes);
    render();
    const live = Object.values(state.games).filter(g => g.state === 'in').length;
    $('status').innerHTML = live ? `<span class="dot"></span>${live} live · updated ${new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}` : `No live games · updated ${new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}`;
    $('err').style.display = 'none';
  }catch(e){
    console.error(e);
    $('err').textContent = 'Could not load ESPN data: ' + e.message;
    $('err').style.display = 'block';
  }
}

function bind(){
  const s = state.settings;
  $('fScoring').value = String(s.rec);
  $('fPassTd').value = String(s.passTd);
  $('fPos').value = s.pos;
  $('fFantasy').classList.toggle('on', s.fantasy);
  const save = () => { store.set('gd.settings', s); state.shown = PAGE; render(); };
  $('fScoring').onchange = e => { s.rec = +e.target.value; save(); };
  $('fPassTd').onchange = e => { s.passTd = +e.target.value; save(); };
  $('fPos').onchange = e => { s.pos = e.target.value; save(); };
  $('fGame').onchange = e => { s.game = e.target.value; save(); };
  $('fFantasy').onclick = () => { s.fantasy = !s.fantasy; $('fFantasy').classList.toggle('on', s.fantasy); save(); };
  $('fMine').classList.toggle('on', s.mine);
  $('fMine').onclick = () => { s.mine = !s.mine; $('fMine').classList.toggle('on', s.mine); save(); };
  $('leagues').onclick = e => {
    const m = e.target.closest('[data-mu]');
    if(m){
      const [key, idx] = m.dataset.mu.split('|');
      state.openMu = {key, idx: +idx};
      placeDetail(); renderDetail(); renderLeagues();
      if(!window.matchMedia('(min-width: 1400px)').matches) $('side').scrollIntoView({behavior:'smooth'});
      return;
    }
    const a = e.target.closest('[data-expand]'); if(!a) return;
    const k = a.dataset.expand;
    state.expanded.has(k) ? state.expanded.delete(k) : state.expanded.add(k);
    renderLeagues();
  };
  $('more').onclick = () => { state.shown += PAGE; render(); };
  $('games').onclick = e => {
    const el = e.target.closest('.game'); if(!el) return;
    s.game = s.game === el.dataset.id ? 'all' : el.dataset.id; save();
  };
}

bind();
window.addEventListener('resize', () => { if(state.openMu){ placeDetail(); } });
refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
